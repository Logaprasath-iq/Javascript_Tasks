<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Tasks</title>
</head>
<body>
    <h1>JavaScript Tasks</h1>

    <script>
        // Task 1: Variable Practice
        let studentName = "Logaprasath";
        let studentAge = 21;
        let studentCourse = "MERN Stack";

        console.log(studentName);
        console.log(studentAge);
        console.log(studentCourse);

        // Task 2: Var, Let, Const
        var company = "Stackly";
        let salary = 20000;
        const country = "India";

        company = "Google";
        salary = 30000;

        console.log(company);
        console.log(salary);
        console.log(country);

        // Task 3: User Name
        let userName = prompt("What is your name?");
        console.log("Welcome " + userName);

        // Task 4: Confirm Box
        let knowsJavaScript = confirm("Do you know JavaScript?");
        console.log(knowsJavaScript);

        // Task 5: Student Information
        let name = prompt("Enter Student Name:");
        let age = prompt("Enter Student Age:");
        let city = prompt("Enter Student City:");

        console.log("Name : " + name);
        console.log("Age : " + age);
        console.log("City : " + city);

        // Task 6: Alert Message
        let course = "JavaScript";
        alert("Welcome to " + course);

        // Task 7: Document Write
        document.writeln("<h3>Hello Student</h3>");
        document.writeln("<p>Welcome to JavaScript</p>");

        // Task 8: Favorite Things
        let favoriteFood = "Chicken Biryani";
        let favoriteColor = "Black";
        let favoriteMovie = "Leo";

        console.log("Food : " + favoriteFood);
        console.log("Color : " + favoriteColor);
        console.log("Movie : " + favoriteMovie);

        // Task 9: Mini Bio Data
        let bioName = "Logaprasath";
        let bioAge = 21;
        let phone = "9876543210";
        let email = "logaprasath@example.com";

        console.log("Name : " + bioName);
        console.log("Age : " + bioAge);
        console.log("Phone : " + phone);
        console.log("Email : " + email);

        // Task 10: Challenge
        let student = prompt("Enter Your Name:");
        let studentCourseName = prompt("Enter Your Course:");

        alert("Hello " + student + ", Welcome to " + studentCourseName + " Course");
    </script>
</body>
</html>
