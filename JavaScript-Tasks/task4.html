<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Tasks</title>
</head>
<body>

<script>

// Task 1 - Age Category Finder
let age = Number(prompt("Enter Age"));

if (age <= 12) {
    document.write("Child<br><br>");
} else if (age <= 19) {
    document.write("Teenager<br><br>");
} else if (age <= 59) {
    document.write("Adult<br><br>");
} else {
    document.write("Senior Citizen<br><br>");
}

// Task 2 - Salary Hike Calculator
let salary = Number(prompt("Enter Salary"));
let newSalary;

if (salary < 20000) {
    newSalary = salary + (salary * 20 / 100);
} else if (salary <= 50000) {
    newSalary = salary + (salary * 10 / 100);
} else {
    newSalary = salary + (salary * 5 / 100);
}

document.write("New Salary: " + newSalary + "<br><br>");

// Task 3 - Electricity Bill
let units = Number(prompt("Enter Units"));
let bill;

if (units <= 100) {
    bill = units * 5;
} else if (units <= 200) {
    bill = units * 7;
} else {
    bill = units * 10;
}

document.write("Bill: ₹" + bill + "<br><br>");

// Task 4 - ATM
let balance = 10000;
let amount = Number(prompt("Enter Withdrawal Amount"));

if (amount <= balance) {
    balance = balance - amount;
    document.write("Remaining Balance: ₹" + balance + "<br><br>");
} else {
    document.write("Insufficient Funds<br><br>");
}

// Task 5 - Login
let username = prompt("Enter Username");
let password = prompt("Enter Password");

if (username == "admin" && password == "12345") {
    document.write("Login Successful<br><br>");
} else {
    document.write("Invalid Login<br><br>");
}

// Task 6 - Recharge Offer
let recharge = Number(prompt("Enter Recharge Amount"));

if (recharge >= 499) {
    document.write("Netflix Offer<br><br>");
} else if (recharge >= 299) {
    document.write("2GB Extra Data<br><br>");
} else {
    document.write("No Offer<br><br>");
}

// Task 7 - Traffic Signal
let color = prompt("Enter Signal Color");

switch(color.toLowerCase()) {
    case "red":
        document.write("Stop<br><br>");
        break;
    case "yellow":
        document.write("Ready<br><br>");
        break;
    case "green":
        document.write("Go<br><br>");
        break;
    default:
        document.write("Invalid Color<br><br>");
}

// Task 8 - Attendance
let workingDays = Number(prompt("Working Days"));
let presentDays = Number(prompt("Present Days"));

let percentage = (presentDays / workingDays) * 100;

if (percentage >= 75) {
    document.write("Eligible<br><br>");
} else {
    document.write("Not Eligible<br><br>");
}

// Task 9 - Bus Ticket
let tickets = Number(prompt("Number of Tickets"));

let total = tickets * 500;
let gst = total * 0.05;
let finalAmount = total + gst;

document.write("Final Amount: ₹" + finalAmount + "<br><br>");

// Task 10 - Restaurant Bill
let foodCost = Number(prompt("Food Cost"));

if (foodCost > 2000) {
    foodCost = foodCost - (foodCost * 10 / 100);
}

document.write("Final Bill: ₹" + foodCost + "<br><br>");

// Task 11 - Police Recruitment
let pAge = Number(prompt("Age"));
let height = Number(prompt("Height"));
let weight = Number(prompt("Weight"));

if (pAge >= 18 && height >= 160 && weight >= 55) {
    document.write("Selected<br><br>");
} else {
    document.write("Rejected<br><br>");
}

// Task 12 - Student Result
let m1 = Number(prompt("Mark 1"));
let m2 = Number(prompt("Mark 2"));
let m3 = Number(prompt("Mark 3"));
let m4 = Number(prompt("Mark 4"));
let m5 = Number(prompt("Mark 5"));

let totalMarks = m1 + m2 + m3 + m4 + m5;
let percent = totalMarks / 5;

document.write("Percentage: " + percent + "<br>");

if (percent >= 90) {
    document.write("Grade A+<br><br>");
} else if (percent >= 80) {
    document.write("Grade A<br><br>");
} else if (percent >= 70) {
    document.write("Grade B<br><br>");
} else if (percent >= 60) {
    document.write("Grade C<br><br>");
} else {
    document.write("Fail<br><br>");
}

// Task 13 - Shift Finder
let time = Number(prompt("Enter Time"));

if (time >= 6 && time < 14) {
    document.write("Morning Shift<br><br>");
} else if (time >= 14 && time < 22) {
    document.write("Afternoon Shift<br><br>");
} else {
    document.write("Night Shift<br><br>");
}

// Task 14 - Loan Eligibility
let ageLoan = Number(prompt("Age"));
let salaryLoan = Number(prompt("Salary"));
let experience = Number(prompt("Experience"));

if (ageLoan >= 21 && salaryLoan >= 25000 && experience >= 2) {
    document.write("Eligible<br><br>");
} else {
    document.write("Not Eligible<br><br>");
}

// Task 15 - Cab Fare
let distance = Number(prompt("Distance"));

let fare;

if (distance <= 5) {
    fare = distance * 20;
} else {
    fare = (5 * 20) + ((distance - 5) * 15);
}

document.write("Fare: ₹" + fare + "<br><br>");

// Task 16 - Multiplication Table
let num = Number(prompt("Enter Number"));

for (let i = 1; i <= 10; i++) {
    document.write(num + " x " + i + " = " + (num * i) + "<br>");
}

document.write("<br>");

// Task 17 - Password Checker
let length = Number(prompt("Password Length"));

if (length < 6) {
    document.write("Weak<br><br>");
} else if (length <= 10) {
    document.write("Medium<br><br>");
} else {
    document.write("Strong<br><br>");
}

// Task 18 - Bonus System
let exp = Number(prompt("Experience"));
let empSalary = Number(prompt("Salary"));

let bonus;

if (exp <= 2) {
    bonus = empSalary * 0.05;
} else if (exp <= 5) {
    bonus = empSalary * 0.10;
} else {
    bonus = empSalary * 0.20;
}

document.write("Bonus: ₹" + bonus + "<br><br>");

// Task 19 - Countdown
let count = 10;

while (count >= 1) {
    document.write(count + "<br>");
    count--;
}

document.write("Happy New Year<br><br>");

// Task 20 - Interview Selection
let degree = prompt("Degree Completed? yes/no");
let communication = prompt("Communication Good? yes/no");
let score = Number(prompt("Technical Score"));

if (degree == "yes" && communication == "yes" && score >= 70) {
    document.write("Selected");
} else {
    document.write("Rejected");
}

</script>

</body>
</html>
